# ═══════════════════════════════════════════════════════════════════
# Insurance RAG — Main App (updated with shared network)
# ═══════════════════════════════════════════════════════════════════
#
# Changes from your original:
#   - Added "networks: insurance-rag-network" to db, api, worker, redis
#   - Added external network definition at the bottom
#
# Before starting, create the shared network once:
#   docker network create insurance-rag-network
# ═══════════════════════════════════════════════════════════════════

services:
  # ── API Server ──────────────────────────────────────────────────────────
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./app:/app/app
      - localstorage:/app/storage
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - insurance-rag-network

  # ── Celery Worker (async processing) ────────────────────────────────────
  worker:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A app.worker worker --loglevel=info --concurrency=2
    networks:
      - insurance-rag-network

  # ── PostgreSQL ──────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: insurance_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - insurance-rag-network

  # ── Redis ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - insurance-rag-network

volumes:
  pgdata:
  redisdata:
  localstorage:

networks:
  insurance-rag-network:
    external: true